name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate core files
        run: |
          test -f index.html && echo "index.html exists"
          test -f app.js && echo "app.js exists"
          test -f data.js && echo "data.js exists"
          test -f config.example.js && echo "config.example.js exists"

      - name: Check for sensitive files
        run: |
          # Warn if keystore or secrets are tracked
          if git ls-files | grep -qi 'keystore\|\.env\|secret'; then
            echo "⚠️ WARNING: Sensitive file detected in repository!"
            git ls-files | grep -i 'keystore\|\.env\|secret' || true
          else
            echo "✓ No sensitive files found"
          fi

      - name: Check manifest
        run: |
          python -c "import json; json.load(open('manifest.json')); print('manifest.json: valid')"

      - name: Check JS syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check data.js
          echo "JS syntax: valid"

      - name: Check Python syntax
        run: |
          python -m py_compile api/main.py build_apk.py make_icons.py
          echo "Python syntax: valid"

      - name: Check API data consistency
        run: |
          node tools/sync_api_data.js
          if ! git diff --exit-code --quiet api/data.json; then
            echo "::error::api/data.json is stale — run 'node tools/sync_api_data.js' and commit the result"
            git diff --stat api/data.json
            exit 1
          fi
          echo "api/data.json in sync with data.js"

      - name: Check config example
        run: |
          test -f config.example.js && echo "config.example.js exists"
          # Ensure config.js is NOT tracked
          ! git ls-files | grep -q '^config.js$' && echo "config.js correctly gitignored"
