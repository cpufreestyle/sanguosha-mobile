name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 仅部署 PWA 所需的 Web 文件（排除 android/、api/ 等非站点内容）
      - name: Collect site files
        run: |
          mkdir -p _site/icons
          cp index.html app.js data.js sw.js manifest.json config.example.js _site/
          cp icons/* _site/icons/

      # 生成热更新清单（APK 内 WebView 通过它检查并下载最新 JS/数据）
      - name: Generate version.json
        run: |
          python -c "
          import json, re, datetime
          m = re.search(r'VERSION = \"([\d.]+)\"', open('data.js', encoding='utf-8').read())
          version = m.group(1)
          manifest = {
              'version': version,
              'updated': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'files': {
                  'app.js': open('app.js', encoding='utf-8').read(),
                  'data.js': open('data.js', encoding='utf-8').read(),
              },
          }
          json.dump(manifest, open('_site/version.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('version.json generated for', version)
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
